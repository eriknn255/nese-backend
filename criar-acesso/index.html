<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Criar acesso</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/google-sans-flex/wght.css">
</head>
<body>
<button id="theme-btn" type="button" aria-label="Alternar tema" hidden>
  <span id="theme-icon">🌙</span><span id="theme-label"></span>
</button>
<main class="caixa" id="caixa" hidden>
  <img src="/dashboard/img/logo-nese.webp" class="logo-img" alt="" width="44" height="44">
  <h1 id="titulo" hidden>Criar acesso</h1>
  <div class="status" id="status-verificando"></div>
  <form id="form" hidden>
    <label>
      <span>Token</span>
      <input type="password" id="token" autocomplete="off">
    </label>
    <label>
      <span>Nome</span>
      <input type="text" id="nome" required>
    </label>
    <label>
      <span>E-mail</span>
      <input type="email" id="email" autocomplete="off" required>
    </label>
    <label>
      <span>Senha</span>
      <input type="password" id="senha" autocomplete="new-password" minlength="10" required>
    </label>
    <label>
      <span>Nível</span>
      <select id="nivel">
        <option value="full">full</option>
        <option value="ver">read</option>
      </select>
    </label>
    <div class="msg" id="msg" hidden></div>
    <button type="submit" id="btn">Enviar</button>
  </form>
</main>
<script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Criar acesso</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/google-sans-flex/wght.css">
</head>
<body>

<!-- ==========================================================================
     ADMINISTRAÇÃO DE LOGINS INTERNOS — única tela pra criar, sobrescrever
     e apagar credencial de funcionário. Substituiu a aba "Contas de
     acesso" da moderação: conta de funcionário não é moderação, e ter as
     duas portas dobrava manutenção sem ganho.

     O formulário se adapta: preenchido o e-mail, a página consulta se já
     existe login. Não existe -> um botão (Salvar). Existe -> dois
     (Salvar alterações / Apagar para sempre).

     Sem sessão: quem manda aqui é o ADMIN_TOKEN + IP na allowlist. Fora
     disso a página vira um 404 (ver mostrarBloqueio em script.js).
     ========================================================================== -->

<button id="theme-btn" type="button" aria-label="Alternar tema" hidden>
  <span id="theme-icon">🌙</span><span id="theme-label"></span>
</button>

<main class="caixa" id="caixa" hidden>
  <img src="/dashboard/img/logo-nese.webp" class="logo-img" alt="" width="44" height="44">
  <h1 id="titulo" hidden>Acesso interno</h1>
  <div class="status" id="status-verificando"></div>

  <form id="form" hidden>
    <label class="largo">
      <span>Token de admin</span>
      <input type="password" id="token" autocomplete="off" required>
    </label>

    <label class="largo">
      <span>E-mail do funcionário</span>
      <input type="email" id="email" autocomplete="off" required>
    </label>

    <!-- Estado da consulta: diz se aquele e-mail já tem login, pra não
         restar dúvida sobre o que os botões vão fazer. -->
    <div class="consulta" id="consulta" hidden></div>

    <label>
      <span>Nome completo</span>
      <input type="text" id="nome" required>
    </label>

    <label>
      <span>Senha (mínimo 10 caracteres)</span>
      <input type="password" id="senha" autocomplete="new-password" minlength="10" required>
    </label>

    <label>
      <span>Nível</span>
      <select id="nivel">
        <option value="ver">ver — somente dashboard</option>
        <option value="full">full — dashboard + moderação</option>
      </select>
    </label>

    <!-- ============ RESTRIÇÕES DESTE LOGIN ============
         De onde e quando ESTA credencial pode ser usada. Não têm relação
         com as regras que guardam esta página (essas ficam em
         config/acesso.json + .env e valem só pro admin).

         IP e horário são obrigatórios: o servidor recusa criar login sem
         eles. País é opcional — geo-IP erra com VPN e operadora móvel, e
         exigir uma camada não confiável só geraria bloqueio inexplicável.

         Verificados a CADA requisição: sair da janela derruba a sessão
         aberta, não só impede de entrar. -->
    <fieldset class="restricoes">
      <legend>Restrições de uso deste login</legend>

      <div class="restricoes-grid">
        <label class="largo">
          <span>IPs autorizados (um por linha; aceita CIDR)</span>
          <textarea id="r-ips" rows="2" spellcheck="false" placeholder="168.90.91.0/24"></textarea>
        </label>

        <!-- Os <option> destes três seletores são montados por JS a
             partir do que GET /bootstrap/status devolve (ver
             utils/opcoesRestricao.js no backend). Ficam vazios aqui de
             propósito: escrever a lista no HTML criaria uma segunda
             fonte, livre pra divergir da que o servidor valida. -->
        <label>
          <span>Janela de horário</span>
          <select id="r-horario"></select>
        </label>

        <label>
          <span>Fuso horário</span>
          <select id="r-fuso"></select>
        </label>

        <label class="largo">
          <span>País permitido</span>
          <select id="r-paises"></select>
        </label>

      </div>
    </fieldset>

    <div class="msg" id="msg" hidden></div>

    <!-- Botões trocam conforme a consulta. Nenhum aparece antes dela:
         sem saber se a conta existe, "Salvar" seria ambíguo. -->
    <button type="button" id="btn-verificar">Verificar e-mail</button>
    <button type="button" id="btn-criar" hidden>Salvar</button>
    <button type="button" id="btn-salvar" hidden>Salvar alterações</button>
    <button type="button" id="btn-apagar" class="btn-perigo" hidden>Apagar para sempre</button>
  </form>

</main>

<script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Criar acesso — Nese</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/google-sans-flex/wght.css">
</head>
<body>
<main class="caixa">
  <img src="/dashboard/img/logo-nese.webp" alt="Nese" width="44" height="44">
  <h1 id="titulo" hidden>Criar acesso</h1>
  <p class="sub" id="subtitulo" hidden></p>
  <div class="status" id="status-verificando">Carregando…</div>
  <div class="status" id="status-bloqueado" hidden>
    Página indisponível.
  </div>
  <form id="form" hidden>
    <label>
      <span>Token de admin</span>
      <input type="password" id="token" autocomplete="off">
    </label>
    <label>
      <span>Nome</span>
      <input type="text" id="nome" required>
    </label>
    <label>
      <span>E-mail</span>
      <input type="email" id="email" autocomplete="off" required>
    </label>
    <label>
      <span>Senha (mínimo 10 caracteres)</span>
      <input type="password" id="senha" autocomplete="new-password" minlength="10" required>
    </label>
    <label>
      <span>Nível de acesso</span>
      <select id="nivel">
        <option value="full">full — dashboard + moderação</option>
        <option value="ver">ver — somente dashboard</option>
      </select>
    </label>
    <div class="msg" id="msg" hidden></div>
    <button type="submit" id="btn">Criar login</button>
  </form>
  <p class="rodape" id="rodape" hidden>
    Entre pelo
    <a href="/dashboard/">dashboard</a> ou pela <a href="/moderacao/">moderação</a>.
  </p>
</main>
<script src="script.js"></script>
</body>
</html>
